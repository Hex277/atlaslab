<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://xoebhhdirsvjorjlrfzi.supabase.co; base-uri 'none'; form-action 'none'">
<title>Qapalı bölmə</title>
<style>
:root{
  --bg:#000000;
  --ink:#ffffff;
  --mut:#a0a0a0;
  --line:#B89A5A;
  --acc:#B89A5A;
  --panel:#0c0c0c;
  --err:#ff5555;
  --btn-text:#000000;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
[hidden]{display:none!important}
input,select,button{font:inherit;color:inherit}

#login{min-height:100vh;display:grid;place-items:center;padding:24px}
#login form{width:min(360px,100%);display:grid;gap:12px;background:var(--panel);padding:24px;border-radius:10px;border:1px solid var(--line)}
h1{font-size:22px;margin:0 0 4px;font-weight:650;color:var(--acc);text-align:center}

.fld{padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;width:100%}
.fld:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
select.fld option{background:var(--panel);color:var(--ink)}

.btn{padding:10px 14px;border:1px solid var(--acc);background:var(--acc);color:var(--btn-text);border-radius:6px;cursor:pointer;font-weight:600;transition:opacity .2s}
.btn.ghost{background:transparent;color:var(--acc);border-color:var(--line);font-weight:500}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:default}
.err{color:var(--err);min-height:1.5em;margin:0;text-align:center}

#app{padding:20px clamp(12px,3vw,32px) 40px;max-width:1500px;margin:0 auto}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tabs button{border:0;background:var(--panel);color:var(--ink);padding:9px 14px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--acc);color:var(--btn-text);font-weight:600}
.sp{flex:1}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar #q{flex:2 1 260px}
.bar select{flex:1 1 170px;max-width:260px}

.wrap{border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid rgba(184,154,90,0.2);vertical-align:top}
th{background:var(--panel);font-weight:600;color:var(--acc);font-size:13px;white-space:nowrap;border-bottom:2px solid var(--line)}
tbody tr:hover{background:rgba(184,154,90,0.05)}
td.n{color:var(--mut);font-variant-numeric:tabular-nums}
td.m{font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--mut)}
.pg{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px;color:var(--mut)}

/* Mobil Görünüş (Kart Sistemi) */
@media (max-width: 768px) {
  .wrap { background: transparent; border: none; }
  table, thead, tbody, th, td, tr { display: block; }
  thead { display: none; } /* Cədvəl başlığını mobildə gizlət */
  
  tbody tr {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 12px;
    padding: 12px 16px;
  }
  tbody tr:hover { background: var(--panel); }
  
  td {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px dashed rgba(184, 154, 90, 0.2);
    text-align: right;
  }
  td:last-child { border-bottom: none; }
  
  /* Hər bir xanaya aid olduğu sütunun adını sol tərəfdə göstərmək üçün */
  td::before {
    content: attr(data-label);
    font-weight: 600;
    color: var(--acc);
    text-align: left;
    padding-right: 12px;
  }
}
</style>
</head>
<body>

<section id="login">
  <form id="lf" autocomplete="off">
    <h1>Qapalı bölmə</h1>
    <input class="fld" id="pw" type="password" placeholder="Şifrə" autocomplete="current-password" maxlength="200" required>
    <button class="btn" id="lb" type="submit">Daxil ol</button>
    <p class="err" id="le" role="alert"></p>
  </form>
</section>

<main id="app" hidden>
  <div class="top">
    <div class="tabs">
      <button id="t1" data-t="zt_siyahi" aria-pressed="true">ZT siyahı</button>
      <button id="t2" data-t="zm_siyahi" aria-pressed="false">ZM siyahı</button>
    </div>
    <span class="sp"></span>
    <button class="btn ghost" id="out">Çıxış</button>
  </div>
  <div class="bar">
    <input class="fld" id="q" type="search" placeholder="Ad, soyad və ya ata adı üzrə axtar" maxlength="100">
    <span id="filters" style="display:contents"></span>
  </div>
  <div class="wrap"><table><thead id="th"></thead><tbody id="tb"></tbody></table><div class="empty" id="em" hidden>Heç nə tapılmadı.</div></div>
  <div class="pg"><span id="info"></span><button class="btn ghost" id="pv">Əvvəlki</button><button class="btn ghost" id="nx">Sonrakı</button></div>
</main>

<script>
const API = "https://xoebhhdirsvjorjlrfzi.supabase.co/functions/v1/private-api";
const $ = id => document.getElementById(id);
const BASE = [["No","№"],["ad_soyad_ata","Ad, soyad, ata adı"],["fin_kod","FİN"],["dogum_tarixi","Doğum tarixi"],["tehsil_muessisesi","Təhsil müəssisəsi"],["ixtisas","İxtisas"]];
const COLS = { zt_siyahi: BASE, zm_siyahi: BASE.concat([["vezife","Vəzifə"],["elmi_ad","Elmi ad"],["kafedra","Kafedra"]]) };
const FILTERS = { zt_siyahi:["ixtisas"], zm_siyahi:["ixtisas","vezife","elmi_ad","kafedra"] };
const LABEL = { ixtisas:"İxtisas", vezife:"Vəzifə", elmi_ad:"Elmi ad", kafedra:"Kafedra" };

let token = null, table = "zt_siyahi", page = 0, size = 50, total = 0, timer;

async function api(body){
  const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"application/json", ...(token ? { Authorization:"Bearer "+token } : {}) }, body:JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && token) { logout("Sessiya bitdi. Yenidən daxil olun."); }
  if (!r.ok) throw new Error(j.error || "Xəta baş verdi");
  return j;
}
function logout(msg){
  token = null; $("app").hidden = true; $("login").hidden = false;
  $("pw").value = ""; $("le").textContent = msg || ""; $("tb").replaceChildren();
}
$("out").onclick = () => logout();

$("lf").onsubmit = async e => {
  e.preventDefault(); $("lb").disabled = true; $("le").textContent = "";
  try {
    const j = await api({ action:"login", password:$("pw").value });
    token = j.token; $("pw").value = "";
    $("login").hidden = true; $("app").hidden = false;
    switchTable("zt_siyahi");
  } catch (err) { $("le").textContent = err.message; }
  $("lb").disabled = false;
};

function switchTable(t){
  table = t; page = 0; $("q").value = "";
  $("t1").setAttribute("aria-pressed", t === "zt_siyahi"); $("t2").setAttribute("aria-pressed", t === "zm_siyahi");
  const th = document.createElement("tr");
  COLS[t].forEach(([, l]) => { const c = document.createElement("th"); c.textContent = l; th.append(c); });
  $("th").replaceChildren(th);
  load(true);
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => switchTable(b.dataset.t));

function buildFilters(opts){
  const box = $("filters"); box.replaceChildren();
  FILTERS[table].forEach(f => {
    const s = document.createElement("select"); s.className = "fld"; s.name = f; s.setAttribute("aria-label", LABEL[f]);
    const o0 = new Option(LABEL[f] + ": hamısı", ""); s.add(o0);
    (opts[f] || []).forEach(v => s.add(new Option(v, v)));
    s.onchange = () => { page = 0; load(); };
    box.append(s);
  });
}

async function load(withOptions){
  const filters = {};
  document.querySelectorAll("#filters select").forEach(s => { if (s.value) filters[s.name] = s.value; });
  try {
    const j = await api({ action:"data", table, q:$("q").value, filters, page, withOptions:!!withOptions });
    if (j.options) buildFilters(j.options);
    size = j.size; total = j.total || 0; render(j.rows || []);
  } catch (err) { $("em").hidden = false; $("em").textContent = err.message; }
}

function fmtDate(v){
  const s = String(v ?? "").trim();
  return /^\d{1,2}[\s,./-]+\d{1,2}[\s,./-]+\d{4}$/.test(s) ? s.replace(/[\s,./-]+/g, ".") : s;
}
function render(rows){
  const frag = document.createDocumentFragment();
  rows.forEach(r => {
    const tr = document.createElement("tr");
    COLS[table].forEach(([k, label]) => {
      const td = document.createElement("td");
      td.setAttribute("data-label", label); // Mobil kartlarda başlığı göstərmək üçün
      let v = r[k] ?? "";
      if (k === "fin_kod") v = String(v).toUpperCase();
      if (k === "dogum_tarixi") v = fmtDate(v);
      if (k === "No") td.className = "n"; if (k === "dogum_tarixi" || k === "fin_kod") td.className = "m";
      td.textContent = v;
      tr.append(td);
    });
    frag.append(tr);
  });
  $("tb").replaceChildren(frag);
  $("em").hidden = rows.length > 0; $("em").textContent = "Heç nə tapılmadı.";
  const a = total ? page * size + 1 : 0, b = Math.min(total, page * size + rows.length);
  $("info").textContent = `${a}–${b} / ${total}`;
  $("pv").disabled = page === 0; $("nx").disabled = (page + 1) * size >= total;
}
$("pv").onclick = () => { page--; load(); };
$("nx").onclick = () => { page++; load(); };
$("q").oninput = () => { clearTimeout(timer); timer = setTimeout(() => { page = 0; load(); }, 350); };
</script>
</body>
</html>
